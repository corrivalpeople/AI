<!DOCTYPE html>
<html>
<head>
<title>Break Reminder</title>
<style>
  body { font-family: sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; background-color: #f0f0f0; }
  .container { text-align: center; padding: 20px; border-radius: 8px; background-color: white; box-shadow: 0 0 10px rgba(0,0,0,0.1); }
</style>
</head>
<body>
  <div class="container">
    <p id="message">Relax, a reminder will pop up when it's time to rest.</p>
    <button id="manualReminderBtn">Manual Reminder</button>
    <button id="toggleLogBtn" style="margin-top: 10px;">View Log</button>
    <div id="logContainer" style="display:none; margin-top: 10px; border: 1px solid #ccc; padding: 10px; max-height: 200px; overflow-y: auto; text-align: left;"></div>
  </div>

  <script>
    let reminderLog = [];
    let audioCtx = null;

    function initializeAudio() {
      if (!audioCtx) {
        try {
          audioCtx = new (window.AudioContext || window.webkitAudioContext)();
          console.log("AudioContext initialized.");
        } catch (e) {
          console.error("Web Audio API is not supported or could not be initialized.", e);
        }
      }
      // It's also good practice to resume the AudioContext on a user gesture if it was suspended.
      // This might be needed if the page loads and audioCtx is created, but then suspended by the browser.
      if (audioCtx && audioCtx.state === 'suspended') {
        audioCtx.resume().then(() => console.log("AudioContext resumed."));
      }
    }

    function playBeep() {
      if (!audioCtx) {
        console.warn("AudioContext not available, cannot play beep. Attempting to initialize.");
        initializeAudio(); // Try to initialize it now
        if (!audioCtx) {
          console.error("Failed to initialize AudioContext for beep.");
          // Fallback to alert if audio fails completely
          alert("Time to take a break! (Audio Error)");
          return;
        }
      }
       // Ensure it's resumed, especially if playBeep is called without prior user interaction
      if (audioCtx.state === 'suspended') {
        audioCtx.resume().then(() => {
          console.log("AudioContext resumed by playBeep.");
          // Now actually play the sound
          const oscillator = audioCtx.createOscillator();
          const gainNode = audioCtx.createGain();
          oscillator.connect(gainNode);
          gainNode.connect(audioCtx.destination);

          oscillator.type = 'sine'; // 'sine', 'square', 'sawtooth', 'triangle'
          oscillator.frequency.setValueAtTime(440, audioCtx.currentTime); // A4 note
          gainNode.gain.setValueAtTime(0.3, audioCtx.currentTime); // Start with a gentle volume

          oscillator.start(audioCtx.currentTime);
          gainNode.gain.exponentialRampToValueAtTime(0.00001, audioCtx.currentTime + 0.5); // Fade out
          oscillator.stop(audioCtx.currentTime + 0.5); // Stop after 0.5 seconds
        }).catch(e => {
            console.error("Error resuming AudioContext in playBeep: ", e);
            alert("Time to take a break! (Audio Resume Error)");
        });
      } else {
        // AudioContext is active, play sound directly
        const oscillator = audioCtx.createOscillator();
        const gainNode = audioCtx.createGain();
        oscillator.connect(gainNode);
        gainNode.connect(audioCtx.destination);

        oscillator.type = 'sine';
        oscillator.frequency.setValueAtTime(440, audioCtx.currentTime);
        gainNode.gain.setValueAtTime(0.3, audioCtx.currentTime);

        oscillator.start(audioCtx.currentTime);
        gainNode.gain.exponentialRampToValueAtTime(0.00001, audioCtx.currentTime + 0.5);
        oscillator.stop(audioCtx.currentTime + 0.5);
      }
    }

    function logReminderTime() {
      const now = new Date();
      const year = now.getFullYear();
      const month = String(now.getMonth() + 1).padStart(2, '0'); // Months are 0-indexed
      const day = String(now.getDate()).padStart(2, '0');
      const hours = String(now.getHours()).padStart(2, '0');
      const minutes = String(now.getMinutes()).padStart(2, '0');
      const seconds = String(now.getSeconds()).padStart(2, '0');
      const formattedTime = `${year}-${month}-${day} ${hours}:${minutes}:${seconds}`;
      reminderLog.push(formattedTime);
      console.log("Reminder logged:", formattedTime); // Optional: for easier debugging
      console.log("Current log:", reminderLog); // Optional: for easier debugging
    }

    function triggerReminder() {
      logReminderTime();
      playBeep();
    }

    function setReminder() {
      // Calculate random time interval (between 15 and 35 minutes)
      const minMinutes = 15;
      const maxMinutes = 35;
      const randomMinutes = Math.random() * (maxMinutes - minMinutes) + minMinutes;
      const randomIntervalMilliseconds = randomMinutes * 60 * 1000;

      console.log(`Next reminder in ${randomMinutes.toFixed(2)} minutes.`);

      setTimeout(function() {
        logReminderTime(); // Log before playing the sound
        playBeep();
        // After the sound is played (or initiated), set a new reminder
        setReminder();
      }, randomIntervalMilliseconds);
    }

    // Call the function once when the page loads to start the first timer
    window.onload = function() {
      initializeAudio(); // Attempt to initialize AudioContext on load

      setReminder(); // Start automatic reminders

      const manualReminderBtn = document.getElementById("manualReminderBtn");
      if (manualReminderBtn) {
        manualReminderBtn.addEventListener('click', function() {
          // Ensure audio is initialized on user interaction
          initializeAudio();
          triggerReminder();
        });
      } else {
        console.error("Manual reminder button not found!");
      }

      const toggleLogBtn = document.getElementById("toggleLogBtn");
      const logContainer = document.getElementById("logContainer");

      if (toggleLogBtn && logContainer) {
        toggleLogBtn.addEventListener('click', function() {
          // Ensure audio is initialized on user interaction
          initializeAudio();
          const isLogVisible = logContainer.style.display === "block";
          if (isLogVisible) {
            logContainer.style.display = "none";
            toggleLogBtn.textContent = "View Log";
          } else {
            logContainer.style.display = "block";
            toggleLogBtn.textContent = "Hide Log";
            logContainer.innerHTML = ""; // Clear previous log entries

            if (reminderLog.length === 0) {
              const p = document.createElement("p");
              p.textContent = "No reminders logged yet.";
              logContainer.appendChild(p);
            } else {
              reminderLog.forEach(function(logEntry) {
                const p = document.createElement("p");
                p.textContent = logEntry;
                logContainer.appendChild(p);
              });
            }
          }
        });
      } else {
        console.error("Toggle log button or log container not found!");
      }
    };
  </script>
</body>
</html>
